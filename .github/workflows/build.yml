name: Build

on:
  workflow_dispatch:
  push:
    tags-ignore:
      - "**"
    branches:
      - "**"

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: read

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
          cache: gradle

      - name: Make Gradle executable
        shell: bash
        run: chmod +x ./gradlew

      - name: Build
        shell: bash
        run: ./gradlew clean build

      - name: Show output
        shell: bash
        run: find . -path "*/build/libs/*.jar" -type f

      - name: Upload jar artifact
        uses: actions/upload-artifact@v4
        with:
          name: waterdog-jar
          path: "**/build/libs/*.jar"
          if-no-files-found: error
